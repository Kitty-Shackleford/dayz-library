name: DayZ Backup

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NITRADO_SERVER_ID: ${{ vars.NITRADO_SERVER_ID }}
      DAYZ_BACKUP_PATHS_JSON: ${{ vars.DAYZ_BACKUP_PATHS_JSON }}
      DAYZ_BACKUP_MAX_BYTES: ${{ vars.DAYZ_BACKUP_MAX_BYTES || '524288000' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
      - name: Download configured paths
        env:
          NITRADO_API_TOKEN: ${{ secrets.NITRADO_API_TOKEN }}
        run: node dayz/scripts/backup.mjs
      - name: Upload repository-scoped backup artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dayz-backup-${{ github.run_id }}
          path: dayz-backup/
          retention-days: 14
          if-no-files-found: error
