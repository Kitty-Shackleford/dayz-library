name: DayZ Configuration Validator

on:
  workflow_dispatch:
  push:
    paths:
      - 'dayz/config/**'
      - 'dayz/scripts/validate-config.py'
  schedule:
    - cron: '20 3 * * *'

permissions:
  contents: write

concurrency:
  group: dayz-data-writers
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Validate DayZ XML and JSON
        run: python3 dayz/scripts/validate-config.py
      - name: Commit validation reports
        if: always()
        run: |
          git config user.name "dayz-automation[bot]"
          git config user.email "dayz-automation[bot]@users.noreply.github.com"
          git add dayz/reports/current
          git diff --cached --quiet && exit 0
          git commit -m "report: update DayZ configuration validation"
          git pull --rebase
          git push
